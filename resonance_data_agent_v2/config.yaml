# ============================================================
# RESONANCE DATA AGENT v2 - INCREMENTAL + LIVE + SUPABASE
# ============================================================
# 1. Add your Supabase credentials below
# 2. Add your YouTube API key
# 3. Run: python main.py --init     (first big pull)
# 4. Run: python main.py --live     (24/7 incremental)
# ============================================================

# --- SUPABASE CREDENTIALS (REQUIRED) ---
# Get these from your Supabase dashboard:
#   Project URL: Project Settings > API > URL
#   Service Role Key: Project Settings > API > service_role key
#   DB Password: Project Settings > Database > Password
#   DB Host: Project Settings > Database > Connection string
supabase:
  project_url: ""           # e.g. https://xyzabc123.supabase.co
  service_role_key: ""      # starts with "eyJ..."
  db_password: ""           # your database password
  db_host: ""               # e.g. db.xyzabc123.supabase.co
  db_port: 5432
  db_name: "postgres"
  db_user: "postgres"
  # Use direct postgres for bulk inserts (10x faster)
  # Set to false to use REST API only (slower but simpler)
  use_direct_postgres: true

# --- API KEYS ---
youtube_api_key: ""

# --- COLLECTORS ---
collectors:
  reddit: true
  youtube: true
  kaggle: true
  huggingface: true
  scraper: false

# --- REDDIT ---
reddit:
  subreddits:
    - SkincareAddiction
    - AsianBeauty
    - malegrooming
    - nutrition
    - parenting
    - ZeroWaste
    - streetwear
    - yoga
    - Supplements
    - IndieBeauty
  posts_per_subreddit: 500
  comments_per_post: 10

# --- YOUTUBE ---
youtube:
  channels:
    - "UC_x5XG1OV2P6uZZ5FSM9Ttw"
  max_videos_per_channel: 20
  max_comments_per_video: 100

# --- KAGGLE ---
kaggle:
  datasets:
    - "datasnaek/youtube-new"
    - "snap/amazon-fine-food-reviews"

# --- HUGGING FACE ---
huggingface:
  datasets:
    - "RafaM97/marketing_social_media"
    - "HuggingFaceGECLM/REDDIT_comments"
    - "agentlans/bluesky-sentiment"

# --- SCRAPER ---
scraper:
  targets: []

# --- SCHEDULER (live mode intervals) ---
scheduler:
  reddit_interval_minutes: 15
  youtube_interval_minutes: 30
  kaggle_interval_hours: 24
  huggingface_interval_hours: 24
  scraper_interval_hours: 6

# --- OUTPUT ---
output:
  format: "parquet"
  dir: "./output/compiled"
  batch_size: 5000
  # Also save local backup? (recommended)
  local_backup: true
